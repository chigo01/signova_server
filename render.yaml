services:
  - type: web
    name: signova-server
    env: node
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GOOGLE_CLIENT_IDS
        sync: false
      - key: APPLE_TEAM_ID
        sync: false
      - key: APPLE_KEY_ID
        sync: false
      - key: APPLE_PRIVATE_KEY_BASE64
        sync: false
      - key: APPLE_IOS_CLIENT_ID
        value: com.signova.signova
      - key: APPLE_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: STOCK_NEWS_ALERTS_ENABLED
        value: "true"
      - key: FIREBASE_PUSH_ENABLED
        value: "true"
      - key: FIREBASE_PROJECT_ID
        value: signova-f7c94
      # Paste the complete Firebase service-account JSON into this secret env
      # var. Alternatively, upload a Render secret file and set
      # GOOGLE_APPLICATION_CREDENTIALS to its /etc/secrets/... path.
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: WEBINAR_SERVICE_SECRET
        sync: false
      - key: WEBINAR_MEET_URL
        sync: false
      - key: WEBINAR_NOTIFY_EMAIL
        sync: false
      - key: WEBINAR_FROM_EMAIL
        sync: false
      - key: RAFFLE_ADMIN_PASSWORD
        sync: false
      - key: RAFFLE_ADMIN_SESSION_SECRET
        sync: false
